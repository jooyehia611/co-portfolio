# Blueprint: Laravel API + React static site + MySQL (private)
# Deploy: https://dashboard.render.com/blueprints/new?repo=https://github.com/jooyehia611/co-portfolio
#
# Note: MySQL private service + disk requires a paid Render plan.
# After MySQL is up, import database/ytech_portfolio.sql once (Render Shell / mysql client).

services:
  - type: pserv
    name: co-portfolio-mysql
    runtime: docker
    plan: standard
    autoDeploy: false
    dockerfilePath: ./docker/mysql/Dockerfile
    dockerContext: ./docker/mysql
    disk:
      name: co-portfolio-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: ytech_portfolio
      - key: MYSQL_USER
        value: portfolio
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: co-portfolio-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: Ytech
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          name: co-portfolio-mysql
          type: pserv
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: ytech_portfolio
      - key: DB_USERNAME
        value: portfolio
      - key: DB_PASSWORD
        fromService:
          name: co-portfolio-mysql
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: RUN_DB_SEED
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: co-portfolio-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://co-portfolio-api.onrender.com/api/v1
